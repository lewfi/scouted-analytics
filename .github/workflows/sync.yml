name: Sync Leaguepedia

on:
  schedule:
    - cron: '0 */2 * * *'  # every 2 hours
  workflow_dispatch:      # allows manual trigger from GitHub UI

# Prevent overlapping runs — queue the next one instead of cancelling
concurrency:
  group: sync-leaguepedia
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run Leaguepedia sync
        run: npx tsx scripts/sync-leaguepedia.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEAGUEPEDIA_USERNAME: ${{ secrets.LEAGUEPEDIA_USERNAME }}
          LEAGUEPEDIA_PASSWORD: ${{ secrets.LEAGUEPEDIA_PASSWORD }}
